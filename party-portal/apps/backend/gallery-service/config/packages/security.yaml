security:
    providers:
        jwt_user_provider:
            id: App\Security\JwtUserProvider
            
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/gallery/api
            stateless: true
            provider: jwt_user_provider
            jwt: ~

    access_control:
        - { path: ^/gallery/api, roles: IS_AUTHENTICATED_FULLY }