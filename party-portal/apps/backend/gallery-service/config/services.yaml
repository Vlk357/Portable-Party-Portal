# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Directory where uploaded gallery files will be stored (relative to project root)
    # This path is INSIDE the container.
    gallery_uploads_directory: '%kernel.project_dir%/public/media/gallery_files'
    # Base URL path for accessing uploaded files
    gallery_base_url: '/media/gallery_files' # Matches the public path

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # If you have custom controllers not handled by API Platform resource attributes
    # App\Controller\:
    #     resource: '../src/Controller/'
    #     tags: ['controller.service_arguments']

    # Custom action controller for file upload
    App\Controller\CreateGalleryItemAction:
        tags: ['controller.service_arguments']
        arguments:
            $galleryUploadsDirectory: '%env(APP_GALLERY_STORAGE_PATH)%'
            # $galleryBaseUrl: '%env(APP_GALLERY_BASE_URL)%' # No longer needed here if normalizer handles it

    App\Security\JwtUserProvider: ~

    # Custom Normalizer for GalleryItem
    App\Serializer\GalleryItemNormalizer:
        decorates: 'serializer.normalizer.object' # <--- CHANGE THIS
        # Provide an explicit alias for the inner service if decorating a generic one
        # This helps Symfony resolve the decorated service correctly.
        # The '.inner' suffix is a convention.
        arguments:
            $decorated: '@App\Serializer\GalleryItemNormalizer.inner' # <--- ADD/MODIFY THIS
            $galleryBaseUrl: '%env(APP_GALLERY_BASE_URL)%'
            # Logger will be autowired
        # Add a tag with a priority.
        # A higher number means higher priority (runs earlier among custom normalizers).
        # We want it to run before other generic normalizers but after the one it decorates.
        # Let's try a moderately high priority.
        tags:
            - { name: serializer.normalizer, priority: 100 } # Try a positive priority