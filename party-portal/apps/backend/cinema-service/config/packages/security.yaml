security:
    providers:
        jwt_user_provider:
            id: App\Security\JwtUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/cinema
            stateless: true
            provider: jwt_user_provider
            jwt: ~
            
    access_control:
        - { path: ^/admin, roles: IS_AUTHENTICATED_FULLY }
        # Example: protect all other /api paths, requiring at least an authenticated user
        # - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
