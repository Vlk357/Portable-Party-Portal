version: '3.8'

services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - chat-service
      - video-service
      - gallery-service

  auth-service:
    build: ./server/auth-service
    environment:
      - DB_HOST=postgres
      - DB_NAME=authdb
    depends_on:
      - postgres

  chat-service:
    build: ./server/chat-service
    environment:
      - DB_HOST=postgres
      - DB_NAME=chatdb
    depends_on:
      - postgres

  video-service:
    build: ./server/video-service
    environment:
      - DB_HOST=postgres
      - DB_NAME=videodb
    depends_on:
      - postgres

  gallery-service:
    build: ./server/gallery-service
    environment:
      - DB_HOST=postgres
      - DB_NAME=gallerydb
    depends_on:
      - postgres

  postgres:
    build: ./postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    # Resource limits for PostgreSQL
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    #     reservations:
    #       memory: 512M

volumes:
  postgres_data: