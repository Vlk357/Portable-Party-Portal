# Define resolver using Docker's internal DNS
resolver 127.0.0.11 valid=10s; # Docker's embedded DNS server

server {
    listen 80;
    server_name 192.168.17.238 localhost; # Replace with your server's actual IP

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 192.168.17.238 localhost; # Replace with your server's actual IP

    # --- Variables for backend services (frontend variables are no longer needed for proxying) ---
    set $auth_host auth;
    set $auth_port 9000;
    set $chat_host chat;
    set $chat_port 3000;
    set $cinema_host cinema;
    set $cinema_port 9000;
    set $mercure_host mercure;
    set $mercure_port 80; # Mercure container listens on 80 internally
    set $gallery_host gallery;
    set $gallery_port 9000;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- API Locations (Keep these as is) ---
    location ~ ^/auth/api/ {
        fastcgi_pass $auth_host:$auth_port;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/auth/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/apps/auth/public;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /socket.io/ {
        proxy_pass http://$chat_host:$chat_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat { # For NestJS Chat API and WebSocket fallback
        proxy_pass http://$chat_host:$chat_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/cinema(/|$) {
        fastcgi_pass $cinema_host:$cinema_port;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/cinema/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/apps/cinema/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 300;
    }

    location ^~ /.well-known/mercure {
        proxy_pass http://$mercure_host:$mercure_port;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /movies/ {
        alias /var/www/media/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    location ~ ^/gallery/api/(.*)$ {
        client_max_body_size 100G;
        fastcgi_pass $gallery_host:$gallery_port;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/gallery/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/apps/gallery/public;
        fastcgi_param PATH_INFO /gallery/api/$1;
    }

    location /media/gallery_files/ {
        alias /var/www/gallery_uploads/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
        }
    }

    # --- Frontend App Static File Serving ---
    location /chat-app/ {
        alias /usr/share/nginx/html/chat/;
        try_files $uri $uri/ /chat-app/index.html; # Fallback for chat SPA
        add_header Cache-Control "no-cache";
    }

    # location ~ ^/chat-app/(@vite/|@react-refresh|node_modules/|src/) { # DEV ONLY
    #     proxy_pass http://$frontend_chat_host:$frontend_chat_port; # DEV ONLY
    # } # DEV ONLY

    location /video-app/ {
        alias /usr/share/nginx/html/video/;
        try_files $uri $uri/ /video-app/index.html;
        add_header Cache-Control "no-cache";
    }

    # location ~ ^/video-app/(@vite/|@react-refresh|node_modules/|src/) { # DEV ONLY
    #     proxy_pass http://$frontend_video_host:$frontend_video_port; # DEV ONLY
    # } # DEV ONLY

    location /gallery-app/ {
        alias /usr/share/nginx/html/gallery/;
        try_files $uri $uri/ /gallery-app/index.html;
        add_header Cache-Control "no-cache";
    }

    # location ~ ^/gallery-app/(@vite/|@react-refresh|node_modules/|src/) { # DEV ONLY
    #     proxy_pass http://$frontend_gallery_host:$frontend_gallery_port; # DEV ONLY
    # } # DEV ONLY


    # --- Frontend Shell Application (LAST CATCH-ALL for UI) ---
    location / {
        alias /usr/share/nginx/html/shell/;
        try_files $uri $uri/ /index.html; # Fallback to shell's index.html
        add_header Cache-Control "no-cache";
    }

    # location ~ ^/(@vite/|@react-refresh|node_modules/|src/) { # DEV ONLY - For shell app if base is '/'
    #     proxy_pass http://$frontend_shell_host:$frontend_shell_port; # DEV ONLY
    # } # DEV ONLY
    # --- End Frontend App Static File Serving ---


    # --- Utility Locations ---
    location = /favicon.ico {
        log_not_found off; access_log off;
        # Example: alias /usr/share/nginx/html/shell/favicon.ico;
        return 404;
    }
    location ~ /\.(?!well-known) { # Deny access to dot files/folders, allow .well-known
        deny all;
    }

    # --- Logging ---
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}