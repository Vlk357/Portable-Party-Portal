# Define resolver using Docker's internal DNS
resolver 127.0.0.11 valid=10s; # Docker's embedded DNS server

server {
    listen 80;
    server_name _;
    port_in_redirect off;

    # --- Variables ---
    set $auth_host auth; # Service name from docker-compose
    set $auth_port 9000; # Port PHP-FPM listens on in the auth container
    set $frontend_chat_host frontend-chat;
    set $frontend_chat_port 5174;
    set $chat_host chat; # Service name for NestJS chat backend
    set $chat_port 3000; # Port NestJS chat backend listens on
    set $frontend_video_host frontend-video;
    set $frontend_video_port 5175;
    set $frontend_shell_host frontend-shell;
    set $frontend_shell_port 5176;
    set $cinema_host cinema; # Service name for cinema backend
    set $cinema_port 9000; # Port PHP-FPM listens on in the cinema container
    set $mercure_host mercure; # Service name for Mercure
    set $mercure_port 80;    # Port Caddy/Mercure listens on
    set $gallery_host gallery; # Service name from docker-compose for Gallery service
    set $gallery_port 9000; # Port PHP-FPM listens on in the gallery container

    # --- API Locations (HIGHEST PRIORITY) ---
    location ~ ^/auth/api/ {
        fastcgi_pass $auth_host:$auth_port;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/auth/public/index.php; # Ensure this path is correct inside the auth container
        fastcgi_param DOCUMENT_ROOT /var/www/apps/auth/public;
        # REQUEST_URI is usually passed by fastcgi_params, but ensure it's what your Symfony app expects
        # If SCRIPT_NAME is needed by Symfony router:
        # fastcgi_param SCRIPT_NAME /index.php;
        # fastcgi_split_path_info ^(.+\.php)(/.*)$;
        # fastcgi_param PATH_INFO $fastcgi_path_info;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /socket.io/ {
        proxy_pass http://$chat_host:$chat_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /chat { # Assuming this is for NestJS API and potentially WS upgrade if not /socket.io/
        proxy_pass http://$chat_host:$chat_port; # Add trailing slash if NestJS app expects it for root
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # For WebSockets
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/cinema(/|$) {
        fastcgi_pass $cinema_host:$cinema_port;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/cinema/public/index.php; # Correct path in cinema container
        fastcgi_param DOCUMENT_ROOT /var/www/apps/cinema/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_NAME /index.php; # Often needed for Symfony routing
        fastcgi_read_timeout 300;
    }

    location ^~ /.well-known/mercure {
        proxy_pass http://$mercure_host:$mercure_port;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- Static Assets (if any served directly by Nginx) ---
    # Example for a built auth frontend (if you had one)
    # location /auth/login/ {
    #     alias /var/www/frontend-auth/; # Path inside Nginx container
    #     try_files $uri $uri/ /index.html;
    # }

    # --- Frontend App Proxies (Order might matter if paths overlap) ---
    # If chat app is served at /chat-app/
    location /chat-app/ {
        proxy_pass http://$frontend_chat_host:$frontend_chat_port;
        # ... common proxy headers ...
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Specific assets for chat-app if needed, ensure paths are correct
    location ~ ^/chat-app/(@vite/|@react-refresh|node_modules/|src/) {
         # No rewrite needed if frontend_chat_host serves from its root
        proxy_pass http://$frontend_chat_host:$frontend_chat_port; # Pass the full original URI
        # ... common proxy headers ...
    }

    # If video app is served at /video-app/
    location /video-app/ {
        proxy_pass http://$frontend_video_host:$frontend_video_port;
        # ... common proxy headers ...
    }
    # Specific assets for video-app
    location ~ ^/video-app/(@vite/|@react-refresh|node_modules/|src/) {
        proxy_pass http://$frontend_video_host:$frontend_video_port;
        # ... common proxy headers ...
    }

    location /movies/ {
        alias /var/www/media/;
        
        # Try to serve the direct file, otherwise return 404.
        try_files $uri =404;

        # Add appropriate caching headers for video assets.
        add_header Cache-Control "public, max-age=86400"; # Cache for 1 day, adjust as needed

        # Ensure correct MIME types are served for HLS.
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }
    
    # --- NEW: Gallery API Location ---
    location ~ ^/gallery/api/(.*)$ { # Matches requests like /gallery/api/anything
        fastcgi_pass $gallery_host:$gallery_port; # Passes to gallery service (PHP-FPM)
        include fastcgi_params;

        # SCRIPT_FILENAME and DOCUMENT_ROOT should point to your gallery app's public directory
        # inside the 'gallery' container. Based on your docker-compose, this is /var/www/apps/gallery.
        fastcgi_param SCRIPT_FILENAME /var/www/apps/gallery/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/apps/gallery/public;

        # Construct PATH_INFO for Symfony.
        # If the request is /gallery/api/gallery_items, $1 will be "gallery_items".
        # Symfony expects the full path /gallery/api/gallery_items for routing.
        fastcgi_param PATH_INFO /gallery/api/$1;

        # Remove 'internal;' to allow external access.
        # Remove 'fastcgi_split_path_info' and its related 'PATH_INFO $fastcgi_path_info;'
    }

    # --- NEW: Gallery Uploaded Files Location ---
    # This location serves files directly from the volume mounted into Nginx.
    # Ensure HOST_GALLERY_UPLOADS_DIRECTORY is mounted into Nginx container.
    # Example Nginx service volume:
    # - ${HOST_GALLERY_UPLOADS_DIRECTORY}:/var/www/gallery_uploads:ro
    location /media/gallery_files/ {
        alias /var/www/gallery_uploads/; # Path where HOST_GALLERY_UPLOADS_DIRECTORY is mounted in Nginx
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400"; # Cache for 1 day
        # Add more specific MIME types if needed
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
        }
    }


    # --- Frontend Shell Application (LAST CATCH-ALL for UI) ---
    # This should come after all specific API, backend, and other frontend app locations
    location / { # Removed ^~ to allow regex locations above to be tested first for more specific paths
        proxy_pass http://$frontend_shell_host:$frontend_shell_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --- Utility Locations ---
    location = /favicon.ico {
        log_not_found off; access_log off;
        return 404;
    }
    # location ~ /\. { # Deny access to hidden files - OLD, TOO BROAD
    #     deny all;
    # }
    # Deny access to files/directories starting with a dot (e.g. .git, .htaccess)
    # This is usually safer for Vite as it targets segments starting with '.'
    location ~ /\.(?!well-known|vite) { # Deny access to dot files/folders, but allow .well-known for services like Let's Encrypt or Mercure
        deny all;
    }

    # --- Logging ---
    error_log /var/log/nginx/error.log warn; # Use warn or error for production, debug for dev
    access_log /var/log/nginx/access.log;
}