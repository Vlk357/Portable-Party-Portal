# Define resolver using Docker's internal DNS
resolver 127.0.0.11 valid=10s; # Docker's embedded DNS server

server {
    listen 80;
    # server_name localhost;
    server_name _;
    port_in_redirect off;

    # --- Variables ---
    set $auth_host auth;
    set $auth_port 9000;
    set $frontend_chat_host frontend-chat;
    set $frontend_chat_port 5174;
    set $chat_host chat;
    set $chat_port 3000;
    set $frontend_video_host frontend-video;
    set $frontend_video_port 5175;
    # --- End Variables ---

    # --- Static App Location (Auth) ---
    location /auth/login/ { # <<< Added trailing slash
        alias /var/www/frontend-auth/;
        # index index.html; # Optional, try_files handles index lookup
        try_files $uri $uri/ /index.html; # SPA routing: try file, then dir, then fallback to index.html relative to root
        # add_header Cache-Control "no-cache"; # Optional for testing
    }

    # --- Dev Server Proxy (Chat) ---
    location /chat-app/ {
        proxy_pass http://$frontend_chat_host:$frontend_chat_port; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Specific App Assets (Chat) ---
    # Handles assets requested WITH the /chat-app/ prefix (if base path is set correctly in chat app)
    location ~ ^/chat-app/(@vite/|@react-refresh|node_modules/|src/) {
        rewrite ^/chat-app(/.*)$ $1 break;
        proxy_pass http://$frontend_chat_host:$frontend_chat_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
     location ~ ^/chat-app/.*\.(js|css|map|ico|json|svg)$ {
        rewrite ^/chat-app(/.*)$ $1 break;
        proxy_pass http://$frontend_chat_host:$frontend_chat_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- REMOVE General Assets ---
    # location ~ ^/(@vite/|@react-refresh|node_modules/|src/) { ... } # REMOVE THIS BLOCK
    # location ~ \.(js|css|map|ico|json|svg)$ { ... } # REMOVE THIS BLOCK
    # --- END REMOVAL ---

    # --- API Locations ---
    location ~ ^/auth/api/ {
        # Use variables
        fastcgi_pass $auth_host:$auth_port;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/auth/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/apps/auth/public;
        fastcgi_param REQUEST_URI $request_uri;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }
    # location /auth/ { # Catch-all for other /auth/ paths (API)
    #     # Use variables
    #     fastcgi_pass $auth_host:$auth_port;
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME /var/www/apps/auth/public/index.php;
    #     fastcgi_param DOCUMENT_ROOT /var/www/apps/auth/public;
    #     fastcgi_param REQUEST_URI $request_uri; # Pass original URI
    #     add_header X-Frame-Options "SAMEORIGIN";
    #     add_header X-XSS-Protection "1; mode=block";
    #     add_header X-Content-Type-Options "nosniff";
    # }

    # Proxy WebSocket connections for Socket.IO
    location /socket.io/ { # ADD THIS BLOCK for Socket.IO
        proxy_pass http://$chat_host:$chat_port; # Proxy to chat service root
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s; # Keep connection open
        proxy_send_timeout 86400s; # Keep connection open
    }

    location /chat { # Chat Service API/WS
        # Use variables
        proxy_pass http://$chat_host:$chat_port/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Dev Server Proxy (Video) ---
    location /video-app/ {
        proxy_pass http://$frontend_video_host:$frontend_video_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Specific App Assets (Video) ---
    # Handles assets requested WITH the /video-app/ prefix
    location ~ ^/video-app/(@vite/|@react-refresh|node_modules/|src/) {
        rewrite ^/video-app(/.*)$ $1 break;
        proxy_pass http://$frontend_video_host:$frontend_video_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    location ~ ^/video-app/.*\.(js|css|map|ico|json|svg)$ {
        rewrite ^/video-app(/.*)$ $1 break;
        proxy_pass http://$frontend_video_host:$frontend_video_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Cinema Service Media Files ---
    location /movies/ {
        alias /var/www/media/; # Path inside Nginx container where movies are mounted
        # try_files $uri $uri/ =404; # Optional: if you want Nginx to try finding index.html in subdirs
        add_header Cache-Control "public, max-age=3600";
        # Ensure Nginx can list directory contents if a directory is requested,
        # or serve index files. For HLS, direct file access is usually what's needed.
        # autoindex on; # Consider if you need directory listing for debugging.
    }

    # --- Cinema Service ---
    location ~ ^/cinema(/|$) {
        fastcgi_pass cinema:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/apps/cinema/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/apps/cinema/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 300;
    }

    # --- Mercure Hub ---
    location /.well-known/mercure {
        proxy_pass http://mercure:80;
        
        # Rest of your config remains the same
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
    }

    # --- Utility Locations ---
    location = /favicon.ico { 
        return 404; 
    }
    location ~ /\. { 
        deny all; 
    }

    # --- Logging ---
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;
}