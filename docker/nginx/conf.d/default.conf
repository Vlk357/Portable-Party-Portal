server {
    listen 80;
    server_name localhost;

    # Frontend Auth app - all requests starting with /auth/login
    location /auth/login {
        proxy_pass http://frontend-auth:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite development specific locations
    location ~ ^/(@vite/|@react-refresh|node_modules/|src/) {
        proxy_pass http://frontend-auth:5173$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Handle Vite's assets
    location ~ \.(js|css|map|ico|json|svg)$ {
        proxy_pass http://frontend-auth:5173$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Auth service
    location /auth/ {
        root /var/www/apps;
        try_files $uri $uri/ /auth/public/index.php$is_args$args;

        location ~ ^/auth/public/index\.php(/|$) {
            fastcgi_pass auth:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            
            # Fix path handling
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            
            # Security headers
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-XSS-Protection "1; mode=block";
            add_header X-Content-Type-Options "nosniff";
            
            internal;
        }
    }

    # Block access to . files
    location ~ /\. {
        deny all;
    }

    # Error logs
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;
}