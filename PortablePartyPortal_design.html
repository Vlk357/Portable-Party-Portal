<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile App Design</title>
    <style>
      /* CSS Variables */
      /* :root {
        --color-1: #9d2a2e;
        --color-2: #b55b5a;
        --color-3: #c78e8a;
        --color-4: #e0c2c4;
        --color-5: #f6dfe2;
      } */

      /* Wine red colorscheme */
      /* :root {
        --primary: hsl(343, 91, 22);
        --secondary: hsl(343, 74, 29);
        --accent: hsl(353, 59, 70);
        --background-color: hsl(0, 61, 94);
        --text-color: hsl(256, 75, 8);
      } */

      /* Green colorscheme */
      :root[data-theme="light"] {
        --text: hsl(111, 28%, 5%);
        --background: hsl(90, 10%, 92%);
        --primary: hsl(113, 59%, 24%);
        --secondary: hsl(112, 75%, 60%);
        --accent: hsl(112, 89%, 42%);
      }
      :root[data-theme="dark"] {
        --text: hsl(111, 28%, 95%);
        --background: hsl(90, 10%, 8%);
        --primary: hsl(113, 59%, 76%);
        --secondary: hsl(112, 75%, 40%);
        --accent: hsl(112, 89%, 58%);
      }

      :root {
        /* Wine red colorscheme */
        --primary: hsl(358, 69%, 36%);
        --secondary: hsl(358, 31%, 68%);
        --accent: hsl(0, 90%, 20%);
        --text-color: hsl(246, 90%, 8%);
        --color-5: #f6dfe2;

        --border-radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
      }
      .grid-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* Create 3 equal columns */
        /* height: 100vh; */
      }
      .grid-item {
        flex-direction: column;
        justify-content: center;
        padding: 20px;
        text-align: center;
      }
      .mobile-container {
        width: 375px;
        height: 667px;
        /* margin: 50px auto; */
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .header {
        background-color: var(--primary);
        color: #fff;
        text-align: center;
        padding-left: 10px;
        padding-right: 10px;
      }
      .content {
        /* padding: 20px; */
        display: flex;
        flex-direction: column;
        text-align: center;
        justify-content: center;
        /* align-items: center; */
        /* width: 100%; */
      }
      .footer {
        background-color: var(--primary);
        color: #fff;
        text-align: center;
        padding: 10px;
        position: absolute;
        bottom: 0;
        width: 100%;
      }
      .icon {
        width: 20px;
        height: 20px;
        vertical-align: middle;
        text-align: center;
        fill: #fff;
        padding-left: 2px;
        padding-right: 2px;
        filter: invert(1);
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px;
        background-color: var(--primary);
        color: #fff;
        font-size: 12px;
      }
      .clock {
        font-size: 14px;
        font-weight: bold;
      }
      .hidden {
        display: none;
      }
      .primary {
        background-color: var(--primary);
        color: #fff;
        /* border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer; */
      }
      .submit-div {
        display: flex;
        /* justify-content: center; */
        /* align-items: center; */
        margin: 10px;
      }
      .main-action {
        /* width: 100%; */
        display: flex;
        padding: 10px;
        border: none;
        border-radius: var(--border-radius);
        cursor: pointer;
        justify-content: center;
        width: 100%;
      }
      form {
        display: flex;
        flex-direction: column;
        /* align-items: left; */
        margin: 20px;
        /* margin-top: 30px; */
        border: 1px solid #ccc;
        border-radius: var(--border-radius);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        /* width: 100%; */
      }
      .form-headline {
        /* margin-bottom: 20px; */
        text-align: left;
        margin-left: 10px;
      }
      .form-group {
        margin: 10px;
        /* width: 100%; */
        display: flex;
        flex-direction: column;
      }
      .label {
        font-size: 12px;
        margin-bottom: 5px;
        text-align: left;
      }
      .input-field {
        display: flex;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: var(--border-radius);
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="grid-item hidden">
        <div class="mobile-container">
          <div class="header">
            <div class="status-bar">
              <div class="left">
                <div class="clock">9:15</div>
              </div>
              <div class="right">
                <img src="img/signal.svg" alt="signal icon" class="icon" />
                <img src="img/wifi.svg" alt="WiFi icon" class="icon" />
                <img src="img/battery.svg" alt="battery icon" class="icon" />
              </div>
            </div>
          </div>
          <div class="content"></div>
          <!-- <div class="footer">
            Footer
        </div> -->
        </div>
      </div>

      <div class="grid-item">
        <h2>Login screen</h2>
        <div class="mobile-container">
          <div class="header">
            <div class="status-bar">
              <div class="left">
                <div class="clock">9:15</div>
              </div>
              <div class="right">
                <img src="img/signal.svg" alt="signal icon" class="icon" />
                <img src="img/wifi.svg" alt="WiFi icon" class="icon" />
                <img src="img/battery.svg" alt="battery icon" class="icon" />
              </div>
            </div>
          </div>
          <div class="content">
            <h1>Portable Party Portal</h1>
            <p>Připoj se a užívej si zábavu s ostatními!</p>
            <form>
              <h2 class="form-headline">Přihlášení</h2>
              <div class="form-group">
                <label for="username" class="label">Uživatelské jméno</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="input-field"
                  required
                />
              </div>
              <div class="form-group">
                <label for="password" class="label">Heslo</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="input-field"
                  required
                />
              </div>
              <div class="submit-div">
                <button type="submit" class="primary main-action">
                  Přihlásit
                </button>
              </div>
            </form>
          </div>
          <!-- <div class="footer">
            Footer
        </div> -->
        </div>
      </div>

      <div class="grid-item">
        <h2>Register screen</h2>
        <div class="mobile-container">
          <div class="header">
            <div class="status-bar">
              <div class="left">
                <div class="clock">9:15</div>
              </div>
              <div class="right">
                <img src="img/signal.svg" alt="signal icon" class="icon" />
                <img src="img/wifi.svg" alt="WiFi icon" class="icon" />
                <img src="img/battery.svg" alt="battery icon" class="icon" />
              </div>
            </div>
          </div>
          <div class="content">
            <h1>Portable Party Portal</h1>
            <p>Připoj se a užívej si zábavu s ostatními!</p>
            <form>
              <h2 class="form-headline">Registrace</h2>
              <div class="form-group">
                <label for="username" class="label">Uživatelské jméno</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="input-field"
                  required
                />
              </div>
              <div class="form-group">
                <label for="show-name" class="label">Zobrazované jméno</label>
                <input
                  type="text"
                  name="show-name"
                  id="show-name"
                  class="input-field"
                  required
                />
              </div>
              <div class="form-group">
                <label for="password" class="label">Heslo</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="input-field"
                  required
                />
              </div>
              <div class="submit-div">
                <button type="submit" class="primary main-action">
                  Přihlásit
                </button>
              </div>
            </form>
          </div>
          <!-- <div class="footer">
            Footer
        </div> -->
        </div>
      </div>
    </div>
  </body>
</html>
